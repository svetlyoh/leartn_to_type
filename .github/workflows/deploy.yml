name: verify-and-deploy
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cadence-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: uv sync
      - run: npm ci
        working-directory: frontend
      - run: uv run python scripts/generate_shared.py
      - run: git diff --exit-code
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run pytest
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare production build
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: curl --fail-with-body --silent --show-error --request POST "$CLOUDFLARE_DEPLOY_HOOK"
